[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "DTZ", "RUF"]
ignore = [
    "B008",
    "B904",
    "BLE001",
    "DTZ001",
    "DTZ005",
    "DTZ007",
    "DTZ011",
    "E501",
    "F823",
    "S112",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
markers = ["postgres: requires a PostgreSQL test database"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]
