# Stack para Portainer Community Edition com Nginx Proxy Manager já existente.
# Não publique portas: no NPM, crie um Proxy Host para agenda-api:8000.
# Defina as variáveis abaixo na tela Environment variables da Stack.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenda_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      POSTGRES_DB: agenda_atende
    volumes:
      - agenda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_user -d agenda_atende"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenda_internal

  api:
    image: "${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-cezaralfredo/plataforma_vendedor_online}:${IMAGE_TAG:?Defina IMAGE_TAG no Portainer}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://agenda_user:__POSTGRES_PASSWORD__@postgres:5432/agenda_atende
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Portainer}
      API_KEY: ${API_KEY:?Defina API_KEY no Portainer}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY no Portainer}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME no Portainer}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD?Defina ADMIN_BOOTSTRAP_PASSWORD no Portainer (vazio apos criar a conta)}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET no Portainer}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY:?Defina ADMIN_RECOVERY_KEY no Portainer}
      APP_NAME: ${APP_NAME:-Anauê Design - Vendedor Online}
      DEBUG: "false"
      ASAAS_API_KEY: ${ASAAS_API_KEY:?Defina ASAAS_API_KEY no Portainer}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?Defina ASAAS_WEBHOOK_TOKEN no Portainer}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRIAGE_ENABLED: ${TRIAGE_ENABLED:-true}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-typesafe/jev-1.13}
      SEED_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      agenda_internal:
      npm:
        aliases:
          - agenda-api
          - vendedor-api
          - loja-api
          - loja-anauedesign
      mcp_internal:

volumes:
  agenda_pgdata:

networks:
  agenda_internal:
    driver: bridge
  npm:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
  mcp_internal:
    external: true
    name: "${AGENDA_MCP_NETWORK:-agenda_mcp_internal}"
