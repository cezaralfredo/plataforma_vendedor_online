# =============================================================================
# Stack Independente e Autônoma: RIA 360 (Anauê Design)
# Sem dependências de redes externas ou outros containers.
# =============================================================================
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ria360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ria360_db}
    volumes:
      - ria360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ria_user} -d ${POSTGRES_DB:-ria360_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ria360_net

  api:
    image: "${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-cezaralfredo/plataforma_vendedor_online}:${IMAGE_TAG:-latest}"
    container_name: ria360-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ria_user}:__POSTGRES_PASSWORD__@postgres:5432/${POSTGRES_DB:-ria360_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      API_KEY: ${API_KEY:?Defina API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Defina ADMIN_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin_anaue}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD?Defina ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Defina ADMIN_SESSION_SECRET}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY:?Defina ADMIN_RECOVERY_KEY}
      APP_NAME: ${APP_NAME:-Anauê Design - RIA 360}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      DOMAIN: ${DOMAIN:-ria.anauedesign.com.br}
      DEBUG: "false"
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-token_seguro_placeholder_32_chars_ok}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRIAGE_ENABLED: ${TRIAGE_ENABLED:-true}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-typesafe/jev-1.13}
      SEED_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      ria360_net:
      npm:
        aliases:
          - ria360
          - ria360-api

  waha:
    image: "${WAHA_IMAGE:-devlikeapro/waha:noweb-arm-2026.7.2}"
    container_name: ria360-waha
    restart: unless-stopped
    environment:
      - WAHA_ZIP_LOGS=true
      - WAHA_LOG_FORMAT=JSON
      - WAHA_PRINT_QR=false
      - WAHA_DASHBOARD_ENABLED=false
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WHATSAPP_RESTART_ALL_SESSIONS=true
      - WHATSAPP_HOOK_URL=http://ria360-api:8000/api/webhooks/whatsapp/waha
      - WHATSAPP_HOOK_EVENTS=message.any,message.ack,message.edited,message.revoked,message.reaction,session.status,state.change
    volumes:
      - ria360_waha_data:/app/.sessions
      - ria360_waha_media:/app/.media
    networks:
      ria360_net:
        aliases:
          - waha
          - ria360-waha

volumes:
  ria360_pgdata:
    name: ria360_pgdata
  ria360_waha_data:
    name: ria360_waha_data
  ria360_waha_media:
    name: ria360_waha_media

networks:
  ria360_net:
    name: ria360_net
    driver: bridge
  npm:
    external: true
    name: nginx-proxy_default
