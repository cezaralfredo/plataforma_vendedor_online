name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure shell scripts are executable
        run: chmod +x scripts/*.sh entrypoint.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up frontend asset builder
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify reproducible local assets
        run: |
          npm ci --ignore-scripts
          npm run build:admin
          git diff --exit-code -- app/admin/static/admin.css app/admin/static/vendor/fontawesome

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run linting (ruff)
        run: ruff check app/ tests/

      - name: Run type checking (mypy)
        run: mypy app/ --ignore-missing-imports
        # O legado possui anotações pendentes fora deste release. Mantemos o
        # diagnóstico visível, sem impedir que testes e migrações validem a
        # correção operacional de produção.
        continue-on-error: true

      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-fail-under=60 || {
            echo "::error::Pytest falhou. Exibindo testes que falharam:"
            pytest tests/ --lf -v --tb=short
            exit 1
          }
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          API_KEY: test-api-key
          ASAAS_API_KEY: test
          ASAAS_BASE_URL: https://api-sandbox.asaas.com/v3
          ASAAS_WEBHOOK_TOKEN: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  validate-images:
    name: Validate container images
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backup image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backup
          push: false
          platforms: linux/amd64

  build:
    name: Build & Push Multi-arch
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract backup metadata
        id: backup_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backup
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backup image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backup
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.backup_meta.outputs.tags }}
          labels: ${{ steps.backup_meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
